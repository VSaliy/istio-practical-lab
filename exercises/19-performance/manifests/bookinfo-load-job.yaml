apiVersion: batch/v1
kind: Job
metadata:
  name: bookinfo-load
  namespace: bookinfo
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
      - name: curl
        image: curlimages/curl:8.10.1
        command:
        - sh
        - -c
        - |
          ok=0
          fail=0
          for i in $(seq 1 100); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" http://productpage:9080/productpage || true)
            echo "$i $code"
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
            else
              fail=$((fail + 1))
            fi
          done
          echo "ok=$ok fail=$fail"
          test "$fail" -eq 0
