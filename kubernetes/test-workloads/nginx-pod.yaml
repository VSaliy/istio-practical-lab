apiVersion: v1
kind: Namespace
metadata:
  name: lab-test
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: lab-test
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: lab-test
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
