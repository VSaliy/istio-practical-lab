---
name: istio-analysis
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - run: |
          curl -fsSL https://istio.io/downloadIstio | ISTIO_VERSION=1.24.2 TARGET_ARCH=x86_64 sh -
          ./istio-1.24.2/bin/istioctl analyze istio/installation/profiles/lab-profile.yaml || true
