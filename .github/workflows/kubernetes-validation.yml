---
name: kubernetes-validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
      - run: find kubernetes istio -name '*.yaml' -print0 | xargs -0 -r kubeconform -summary -ignore-missing-schemas
